[package]
name = "slackers_si_units"
version = "0.1.0"
edition = "2024"

[dependencies]
si_unit_parser = { path = "./si_unit_parser" }
si_unit_type = { path = "./si_unit_type" }
si_unit_macro = { path = "./si_unit_macro" }


[workspace]
resolver = "3"
members = ["si_unit_parser", "si_unit_macro", "si_unit_type"]


[features]
f64 = ["si_unit_type/f64"]
fixed = ["si_unit_type/fixed"]