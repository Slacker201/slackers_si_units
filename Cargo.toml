[package]
name = "slackers_si_units"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Slacker201/slackers_si_units"
licence = ["MIT"]

[dependencies]
si_unit_parser = { version = "0.1.0", path = "./si_unit_parser" }
si_unit_type = { version = "0.1.0", path = "./si_unit_type" }
si_unit_macro = { version = "0.1.0", path = "./si_unit_macro" }


[workspace]
resolver = "3"
members = ["si_unit_parser", "si_unit_macro", "si_unit_type"]


[features]
f64 = ["si_unit_type/f64"]
fixed = ["si_unit_type/fixed"]